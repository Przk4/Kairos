<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.name }} — Kairos Profesor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            background-color: #f5f7fa; 
            color: #333; 
        }
        
        .container { 
            max-width: 1100px; 
            margin: auto; 
            background: #fff; 
            padding: 20px 30px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            margin-top: 20px; 
            margin-bottom: 40px;
        }
        
        /* Header */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #ffc107; 
            padding-bottom: 15px; 
        }
        .header h1 { color: #333; font-size: 1.5em; }
        .header h1 span { color: #ffc107; }
        
        .btn { 
            display: inline-block; 
            padding: 8px 16px; 
            text-decoration: none; 
            border-radius: 5px; 
            border: none; 
            cursor: pointer; 
            font-size: 0.9em;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-back { background: #6c757d; color: #fff; }
        .btn-refresh { background: #007bff; color: #fff; }
        
        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 180px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
        }
        .stat-card .label {
            font-size: 0.85em;
            color: #6c757d;
            margin-top: 4px;
        }
        .stat-card.active .number { color: #28a745; }
        .stat-card.inactive .number { color: #dc3545; }
        
        /* Loading state */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e9ecef;
            border-top-color: #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Error */
        .error-msg {
            text-align: center;
            padding: 30px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
        }
        
        /* Student list */
        .student-list {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .student-list-header {
            display: grid;
            grid-template-columns: 40px 1fr 140px 100px 100px;
            gap: 10px;
            padding: 12px 16px;
            background: #343a40;
            color: #fff;
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .student-row {
            display: grid;
            grid-template-columns: 40px 1fr 140px 100px 100px;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
            transition: background 0.15s;
        }
        .student-row:hover { background: #f8f9fa; }
        .student-row:last-child { border-bottom: none; }
        
        /* Status indicator */
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin: auto;
        }
        .status-dot.active { background: #28a745; box-shadow: 0 0 6px rgba(40, 167, 69, 0.4); }
        .status-dot.inactive { background: #dee2e6; }
        
        /* Student name styling */
        .student-name {
            font-weight: 500;
        }
        .student-name.active { color: #28a745; }
        .student-name.inactive { color: #6c757d; }
        .student-email {
            font-size: 0.8em;
            color: #adb5bd;
        }
        
        /* Metric cells */
        .metric {
            text-align: center;
            font-weight: 500;
        }
        .metric.highlight { color: #007bff; }
        .metric.zero { color: #dee2e6; }
        
        /* Kairos status badge */
        .kairos-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78em;
            font-weight: 600;
            text-align: center;
        }
        .kairos-badge.confirmed {
            background: #d4edda;
            color: #155724;
        }
        .kairos-badge.pending {
            background: #f8f9fa;
            color: #adb5bd;
            border: 1px solid #dee2e6;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .student-list-header,
            .student-row {
                grid-template-columns: 30px 1fr 100px;
            }
            .student-list-header > *:nth-child(4),
            .student-list-header > *:nth-child(5),
            .student-row > *:nth-child(4),
            .student-row > *:nth-child(5) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><span>📚</span> {{ course.name }}</h1>
                <p style="color: #6c757d; font-size: 0.9em; margin-top: 4px;">
                    {{ course.code }} · Panel de Profesor
                </p>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-refresh" onclick="loadStudents()">🔄 Actualizar</button>
                <a href="{% url 'index' %}" class="btn btn-back">← Volver</a>
            </div>
        </div>
        
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="number" id="stat-total">—</div>
                <div class="label">Total Alumnos</div>
            </div>
            <div class="stat-card active">
                <div class="number" id="stat-kairos">—</div>
                <div class="label">En Kairos ✅</div>
            </div>
            <div class="stat-card inactive">
                <div class="number" id="stat-pending">—</div>
                <div class="label">Sin sesión</div>
            </div>
        </div>
        
        <!-- Student List Container -->
        <div id="students-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando lista de alumnos desde Canvas...</p>
            </div>
        </div>
    </div>
    
    <script>
    const COURSE_ID = {{ course.id }};
    
    function loadStudents() {
        const container = document.getElementById('students-container');
        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando lista de alumnos desde Canvas...</p>
            </div>
        `;
        
        fetch(`/api/teacher/course/${COURSE_ID}/students/`)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (data.error) throw new Error(data.error);
                renderStudents(data);
            })
            .catch(error => {
                console.error('Error loading students:', error);
                container.innerHTML = `
                    <div class="error-msg">
                        <p><strong>Error al cargar alumnos</strong></p>
                        <p>${error.message}</p>
                        <button class="btn btn-refresh" onclick="loadStudents()" style="margin-top: 15px;">Reintentar</button>
                    </div>
                `;
            });
    }
    
    function renderStudents(data) {
        // Update stats
        document.getElementById('stat-total').textContent = data.total_students;
        document.getElementById('stat-kairos').textContent = data.students_in_kairos;
        document.getElementById('stat-pending').textContent = data.total_students - data.students_in_kairos;
        
        const container = document.getElementById('students-container');
        
        if (!data.students || data.students.length === 0) {
            container.innerHTML = `
                <div class="loading" style="color: #6c757d;">
                    <p>No se encontraron alumnos inscritos en este curso.</p>
                </div>
            `;
            return;
        }
        
        let html = `
            <div class="student-list">
                <div class="student-list-header">
                    <div></div>
                    <div>Alumno</div>
                    <div style="text-align:center">Sesión Kairos</div>
                    <div style="text-align:center">Total Logins</div>
                    <div style="text-align:center">Esta Semana</div>
                </div>
        `;
        
        data.students.forEach(student => {
            const isActive = student.has_kairos_session;
            const statusClass = isActive ? 'active' : 'inactive';
            const nameClass = isActive ? 'active' : 'inactive';
            
            // Format login info
            const totalLogins = student.total_logins || 0;
            const weekLogins = student.logins_this_week || 0;
            const badgeClass = isActive ? 'confirmed' : 'pending';
            const badgeText = isActive ? '✅ Confirmado' : '⬜ Pendiente';
            
            html += `
                <div class="student-row">
                    <div style="text-align:center">
                        <span class="status-dot ${statusClass}"></span>
                    </div>
                    <div>
                        <div class="student-name ${nameClass}">${escapeHtml(student.name)}</div>
                        <div class="student-email">${escapeHtml(student.email || '')}</div>
                    </div>
                    <div style="text-align:center">
                        <span class="kairos-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="metric ${totalLogins > 0 ? 'highlight' : 'zero'}">
                        ${totalLogins}
                    </div>
                    <div class="metric ${weekLogins > 0 ? 'highlight' : 'zero'}">
                        ${weekLogins}
                    </div>
                </div>
            `;
        });
        
        html += '</div>';
        
        // Add last updated timestamp
        html += `
            <p style="text-align: right; color: #adb5bd; font-size: 0.8em; margin-top: 10px;">
                Última actualización: ${new Date().toLocaleString('es-MX')}
            </p>
        `;
        
        container.innerHTML = html;
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Load on page ready
    document.addEventListener('DOMContentLoaded', loadStudents);
    </script>
</body>
</html>
